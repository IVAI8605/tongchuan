# 通传守护进程示例配置。复制成项目根的 config.toml 后按实际目录修改：CLI 默认在当前目录查找 config.toml。
# 注意：不要给本文件加 UTF-8 BOM，否则 TOML 解析会失败。

alias = "我的电脑"
listen = "0.0.0.0:53318"
manage = "0.0.0.0:53319"

# 落点必须在 allow 列表内，否则守护进程拒绝启动（防止 NAS 变成任意写盘入口）
destination = "D:/通传/收到"
allow = ["D:/通传/收到"]

identity_dir = "D:/通传/identity"
log_dir = "D:/通传/logs"
queue_dir = "D:/通传/queue"
log_days = 2
# 日志级别：error | warn | info（默认） | debug。
# 排障时不必改这里，设环境变量 TC_LOG_LEVEL=debug 再重启进程即可；写错会按 info 运行并留一条 warn
log_level = "info"
# 单个日志文件大小上限（字节），超过就改名归档为 daemon_<YYYYMMDD-HHmm>.log 并另起一份；0 = 不轮转。
# 归档文件只改名不删除，清理需人工列清单确认
log_max_bytes = 4194304

# 首次配对用；两端填一样。留空表示不校验配对码（仅限已配对设备）
pair_code = "123456"
auto_accept = true

# 信任策略：closed（默认，只放行信任表内的设备）| open（排障/老设备过渡，切换会记 warn 日志）
# 信任表是 identity_dir/trust.jsonl，用 tc trust 命令或管理页维护
trust_mode = "closed"

# 剪贴板中继（v0.6）。留空=不启动；剪贴板里可能有密码，默认关闭。
# 开启后 `tc clip push|watch|status` 连这个端口，历史落在 identity_dir/clip-history.jsonl
# clip_listen = "0.0.0.0:53320"

# 管理页「浏览…」的根目录白名单（v0.13.3）。配了之后只列这些目录，且只能在其中浏览；
# 留空 = 旧行为（Windows 列盘符并带卷标名，Linux 列 /）。NAS 上建议显式配置，避免翻到系统目录。
# browse_roots = ["/vol1/1000/SSD", "/vol2/1000/好3T"]

# 单会话的并行数据流数（v0.15）。1 = 关闭；上限 8。
# Wi-Fi 上单流常吃不满链路，4 条收益明显；有线千兆以上按实测调小。
# 只有两端都支持（0.15 及以上）才会真正开多流，旧端仍按单流传。
streams = 4

# 接收端哈希缓存（v0.19）。开启后，重复发送同一目录时，已有文件只要「路径 + 大小 + 修改时间」
# 三项全对就直接采信上次算好的指纹，不再重读整份内容。
# 风险：内容变了但大小与修改时间都没变（例如 cp -p 覆盖、从备份还原）会被误判为已存在而不传，
# 所以默认关闭，只建议明确知道这个前提的场景打开。
# 缓存文件是 config.toml 同目录下的 hash-cache.jsonl；该目录必须在服务可写范围内，
# systemd 的 ProtectSystem=strict 场景要把它加进 ReadWritePaths，否则缓存建不出来、等于没开。
# 临时绕过：`tc daemon --config ... --verify` 启动一次，本次运行忽略缓存、全部重算。
# hash_cache = true

# 可被发送方选择的接收位置（v0.16）。手机发送前能查到这些名字并指定一个。
# 每个 path 必须落在 allow 白名单内，否则守护进程拒绝启动；id 唯一、非空。
# 不配这一段时只公布默认落点（destination），旧行为不变。
# 注意：本键及上面的所有配置都必须写在 [[destinations]] 之前；
# 写在表里会被当成该落点的字段而被静默忽略（v0.19 真机验证踩到过）。
# [[destinations]]
# id = "download"
# name = "SSD-下载"
# path = "D:/通传/收到"
# [[destinations]]
# id = "h3t"
# name = "好3T-收件"
# path = "D:/通传/给好3T"
