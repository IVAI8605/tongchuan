[package]
name = "tongchuan-desktop"
version = "1.3.0"
edition = "2021"
description = "通传 Windows 桌面客户端（原生托盘 + 管理页窗口）"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true

[workspace]
