[package]
name = "tc-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 自签证书 + TLS 1.3。明确选 ring 而不是默认的 aws-lc-rs，后者需要 cmake 且体积大。
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
# 管理页令牌要用系统随机数；ring 已随 rustls 编进来，这里只是显式声明依赖
ring = "0.17"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
rustls-pki-types = "1"
# v0.3 守护进程配置用 TOML；纯 Rust，无系统库依赖
toml = "0.8"
# v0.20 二维码配对：管理页把配对地址渲染成 SVG 直接内联进页面。
# 只要 svg 特性，关掉默认的 image/pic——那会把整套图片编解码链带进二进制。
# Android 侧不用它出图（那边用 zxing 直接出位图）。
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# 日志轮转要用本地时间给归档文件命名（daemon_YYYYMMDD-HHmm.log）。
# rcgen 已间接依赖 time 且已编进构建，这里只是把它提到直接依赖；
# local-offset 特性用来取本机时区偏移，取不到时回退 UTC。
time = { version = "0.3", features = ["local-offset"] }

# blake3 只在 Windows 上开 pure：项目目录含中文，mingw 的 ar 处理中文路径会失败（历史坑）。
# Linux/Android 用 NDK clang 或系统 cc，没有这个问题，用默认特性即可恢复 SIMD/汇编，
# 哈希速度差数倍（实测手机扫描阶段曾占满 1.1 个核）。
# resolver v2 下这两个按目标分别生效，不会把 windows 的 pure 特性带到 Android。
[target.'cfg(windows)'.dependencies]
blake3 = { version = "1", features = ["pure"] }

[target.'cfg(not(windows))'.dependencies]
blake3 = "1"
